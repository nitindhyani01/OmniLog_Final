services:
  mongo:
    image: mongo:7
    container_name: omnilog-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build: .
    container_name: omnilog-app
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8085:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017

volumes:
  mongo_data: